version: "3.9"

services:
  db:
    image: ankane/pgvector
    container_name: talentaiq-db
    environment:
      POSTGRES_USER: talentaiq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: talentaiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: